<html lang="en">
<head>

<title>Team Sign-Up · Ladybug, Ladybug</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,600&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--card-edge:rgba(177,18,38,.13);
  --red:#B11226;--red-deep:#861019;--red-soft:#C8324A;
  --gold:#C29A3B;--gold-deep:#9E7A24;
  --ink:#1A1614;--ink-soft:#6B5E52;--ink-dim:#9A8C7C;
  --cream:#FBF3E2;--green:#5B7F4E;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Mulish',sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% -8%,#FFFFFF 0%,#FFFAFA 40%,#FBEDEF 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;background-image:radial-gradient(circle at 8% 12%,rgba(177,18,38,.10) 0 9px,transparent 10px),radial-gradient(circle at 92% 10%,rgba(14,12,10,.05) 0 7px,transparent 8px),radial-gradient(circle at 20% 80%,rgba(177,18,38,.08) 0 6px,transparent 7px),radial-gradient(circle at 84% 82%,rgba(177,18,38,.08) 0 8px,transparent 9px);background-repeat:no-repeat}
.nav{padding:20px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(177,18,38,.08)}
.nav a.back{text-decoration:none;color:var(--ink-soft);font-family:'Mulish',sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem}
.nav a.back:hover{color:var(--red)}
.nav .brand{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--red);font-size:.9rem}
.wrap{max-width:900px;width:100%;margin:0 auto;padding:32px 22px 80px;flex:1}
.kicker{font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:.68rem;color:var(--red);text-align:center;margin-bottom:12px}
h1{font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:clamp(1.9rem,5.4vw,2.9rem);line-height:1.05;letter-spacing:-.015em;text-align:center;margin-bottom:10px}
.event-meta{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:clamp(.98rem,2.2vw,1.1rem);text-align:center;margin-bottom:6px}
.event-loc{font-family:'Mulish',sans-serif;font-size:.82rem;color:var(--ink-dim);text-align:center;letter-spacing:.03em;margin-bottom:14px}
.greeting{font-family:'Fraunces',serif;font-style:italic;color:var(--red);font-size:clamp(1.02rem,2.2vw,1.15rem);text-align:center;margin:16px 0 22px}
.save-pill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;padding:7px 15px;border-radius:999px;font-family:'Mulish',sans-serif;font-weight:800;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;background:var(--green);color:#fff;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 10px 22px rgba(0,0,0,.15)}
.save-pill.show{opacity:.92}
.save-pill.err{background:var(--red)}
section.card{background:#fff;border:1.5px solid var(--card-edge);border-radius:18px;padding:22px 24px;box-shadow:0 12px 24px rgba(177,18,38,.05);margin-bottom:16px}
@media(max-width:560px){section.card{padding:20px 18px}}
.card h2{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;color:var(--ink);margin-bottom:4px}
.card .sub{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:.92rem;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-family:'Mulish',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;font-family:'Mulish',sans-serif;font-size:.98rem;color:var(--ink);background:#FDFCFA;border:1.5px solid rgba(28,22,20,.16);border-radius:10px;padding:11px 13px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(177,18,38,.08);background:#fff}
.field textarea{resize:vertical;min-height:80px;font-family:'Fraunces',serif;font-size:1rem;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
/* RSVP section */
.rsvp{display:flex;gap:10px;flex-wrap:wrap}
.rsvp label{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--card-edge);border-radius:12px;cursor:pointer;background:#fff;transition:all .2s}
.rsvp label:hover{border-color:var(--red-soft)}
.rsvp label.chk{border-color:var(--red);background:linear-gradient(180deg,#fff,#FCF1F2)}
.rsvp label.chk.no{border-color:var(--ink-dim);background:linear-gradient(180deg,#fff,#F5F3F0)}
.rsvp input{width:18px;height:18px;accent-color:var(--red);cursor:pointer;flex:0 0 auto}
.rsvp span{font-family:'Fraunces',serif;font-weight:600}
/* everyone-helps callout */
.callout{background:linear-gradient(180deg,#FFFBF1,#FBEFD0);border:1px dashed var(--gold);border-radius:12px;padding:14px 18px;font-family:'Fraunces',serif;font-style:italic;color:var(--ink);font-size:.95rem;margin-bottom:16px;line-height:1.55;text-align:left}
.callout strong{color:var(--red-deep);font-style:normal;font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.06em;font-size:.82rem;text-transform:uppercase;display:block;margin-bottom:4px}
.packet-card{background:linear-gradient(180deg,#fff,#FCF1F2);border:1.5px solid var(--red);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.packet-card .pl{flex:1;min-width:200px}
.packet-card h3{font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:1.05rem;margin-bottom:2px}
.packet-card p{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:.9rem}
.packet-card a{display:inline-block;font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;background:var(--red);color:#FFF8E8;padding:11px 20px;border-radius:999px;text-decoration:none;transition:background .2s;border:2px solid var(--red)}
.packet-card a:hover{background:var(--red-deep)}
.agenda{display:flex;flex-direction:column;gap:2px}
.agenda-row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:8px 4px;border-bottom:1px solid rgba(28,22,20,.06)}
.agenda-row:last-child{border-bottom:none}
.agenda-row .t{font-family:'Mulish',sans-serif;font-weight:800;font-size:.74rem;letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.agenda-row .a{font-family:'Fraunces',serif;font-size:1rem;color:var(--ink);line-height:1.4}
@media(max-width:520px){.agenda-row{grid-template-columns:88px 1fr;gap:10px}.agenda-row .t{font-size:.68rem}.agenda-row .a{font-size:.94rem}}
/* roles */
.roles{display:flex;flex-direction:column;gap:10px}
.role{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1.5px solid var(--card-edge);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s}
.role:hover{border-color:var(--red-soft)}
.role.picked{background:linear-gradient(180deg,#fff,#FCF1F2);border-color:var(--red)}
.role.dim{opacity:.5;pointer-events:none}
.role .icon{font-size:1.6rem;line-height:1;flex:0 0 30px;text-align:center;margin-top:2px}
.role .body{flex:1;min-width:0}
.role .name{font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:1.05rem;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.role .need{font-family:'Mulish',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);white-space:nowrap}
.role .need.filled{color:var(--green)}
.role .time{display:inline-block;font-family:'Mulish',sans-serif;font-weight:700;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red);background:rgba(177,18,38,.08);padding:2px 8px;border-radius:999px;margin-top:6px}
.role .desc{font-size:.9rem;color:var(--ink-soft);margin-top:6px;line-height:1.45}
.role .others{font-family:'Fraunces',serif;font-style:italic;font-size:.82rem;color:var(--ink-dim);margin-top:6px}
.role .toggle{flex:0 0 auto;align-self:center}
.role .toggle input{width:22px;height:22px;accent-color:var(--red);cursor:pointer}
/* dropdown-pick */
.name-picker{max-width:460px;margin:60px auto;padding:24px;background:#fff;border:1.5px solid var(--card-edge);border-radius:18px;box-shadow:0 14px 30px rgba(177,18,38,.08);text-align:center}
.name-picker h2{font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;color:var(--ink);margin-bottom:8px}
.name-picker p{color:var(--ink-soft);margin-bottom:20px;font-family:'Fraunces',serif;font-style:italic}
.name-picker select{font-family:'Fraunces',serif;font-size:1.1rem;padding:12px 14px;width:100%;background:#FDFCFA;border:1.5px solid rgba(28,22,20,.16);border-radius:12px;cursor:pointer}
.name-picker .hint{margin-top:14px;color:var(--ink-dim);font-size:.85rem}
.error-box{padding:20px 24px;background:rgba(177,18,38,.06);border:1.5px solid rgba(177,18,38,.25);border-radius:14px;color:var(--red-deep);max-width:480px;margin:80px auto;text-align:center}
.error-box h2{font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;margin-bottom:10px}
.spinner{width:36px;height:36px;border:3px solid rgba(177,18,38,.18);border-top-color:var(--red);border-radius:50%;margin:80px auto;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:24px;color:var(--ink-dim);font-size:.76rem;font-family:'Fraunces',serif;font-style:italic}
</style>
</head>
<body>

<nav class="nav">
  <a class="back" href="/">← Back to the book</a>
  <span class="brand">Ladybug, Ladybug</span>
</nav>

<div class="save-pill" id="save-pill" aria-live="polite">✓ Saved</div>

<main class="wrap" id="wrap">
  <div class="spinner" id="spinner"></div>
</main>

<footer>
  Many hands. One heart. A legacy of encouragement.
  <div style="margin-top:12px"><a href="/team-admin" style="color:var(--ink-dim);text-decoration:none;font-family:'Mulish',sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.62rem;border-bottom:1px solid rgba(154,140,124,.4);padding-bottom:2px">Admin</a></div>
</footer>

<script>
const API_BASE = '/api/team';
const params = new URLSearchParams(location.search);
const token = params.get('t');
const wrap = document.getElementById('wrap');
const pill = document.getElementById('save-pill');

function showSaved(msg, isErr){
  pill.textContent = isErr ? '⚠ ' + msg : '✓ ' + (msg || 'Saved');
  pill.classList.toggle('err', !!isErr);
  pill.classList.add('show');
  clearTimeout(showSaved._t);
  showSaved._t = setTimeout(() => pill.classList.remove('show'), 1600);
}

function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function loadPage(){
  if (!token){
    // No token — show the "pick your name" dropdown for the active event
    try {
      const r = await fetch(`${API_BASE}`, {cache:'no-store'});
      if (!r.ok) throw new Error('no active event');
      const data = await r.json();
      renderNamePicker(data);
    } catch (e){
      wrap.innerHTML = '<div class="error-box"><h2>No active event yet.</h2><p>Nothing to sign up for at this moment. Check back later or ask Kari.</p></div>';
    }
    return;
  }
  if (!/^[A-Za-z0-9_-]{8,64}$/.test(token)){
    wrap.innerHTML = '<div class="error-box"><h2>This link is missing something.</h2><p>Try opening <a href="/team">ladybug.karikounkel.com/team</a> and picking your name.</p></div>';
    return;
  }
  const r = await fetch(`${API_BASE}?t=${encodeURIComponent(token)}`, {cache:'no-store'});
  if (r.status === 404){
    wrap.innerHTML = '<div class="error-box"><h2>We don\'t recognize that link.</h2><p>Try <a href="/team">ladybug.karikounkel.com/team</a> and pick your name from the list.</p></div>';
    return;
  }
  if (!r.ok){
    wrap.innerHTML = '<div class="error-box"><h2>Something went sideways.</h2><p>Refresh the page. If it keeps happening, email <a href="mailto:kari@karikounkel.com">kari@karikounkel.com</a>.</p></div>';
    return;
  }
  const data = await r.json();
  renderPage(data);
}

function renderNamePicker(data){
  const {event, members} = data;
  const opts = ['<option value="">— pick your name —</option>']
    .concat(members.map(m => `<option value="${esc(m.token)}">${esc(m.name)}</option>`))
    .join('');
  wrap.innerHTML = `
    <p class="kicker">Team Sign-Up</p>
    <h1>${esc(event.name)}</h1>
    <p class="event-meta">${esc(event.event_date || '')}${event.time_range ? ' · ' + esc(event.time_range) : ''}</p>
    ${event.location ? `<p class="event-loc">${esc(event.location)}</p>` : ''}

    <div class="name-picker">
      <h2>Who's this?</h2>
      <p>Pick your name to open your sign-up page.</p>
      <select id="name-select">${opts}</select>
      <p class="hint">Not on the list? Text Kari and she'll add you.</p>
    </div>
  `;
  document.getElementById('name-select').addEventListener('change', (e) => {
    const t = e.target.value;
    if (t) location.href = `/team?t=${encodeURIComponent(t)}`;
  });
}

function renderPage(data){
  const { event, roles, member, my_signups, tallies } = data;
  const mySet = new Set(my_signups);
  const attend = member.attendance_status || '';
  const notComing = attend === 'not_coming';

  wrap.innerHTML = `
    <p class="kicker">Team Sign-Up</p>
    <h1>${esc(event.name)}</h1>
    <p class="event-meta">${esc(event.event_date || '')}${event.time_range ? ' · ' + esc(event.time_range) : ''}</p>
    ${event.location ? `<p class="event-loc">${esc(event.location)}</p>` : ''}
    <p class="greeting">Hi ${esc(member.name || 'friend')} — let us know if you can be there and where you'd love to help.</p>

    <section class="card">
      <h2>Can you make it?</h2>
      <p class="sub">Autosaves the moment you pick.</p>
      <div class="rsvp">
        <label class="rsvp-yes ${attend==='coming'?'chk':''}"><input type="radio" name="attend" value="coming" ${attend==='coming'?'checked':''}><span>✅ Yes, I'll be there</span></label>
        <label class="rsvp-unsure ${attend==='unsure'?'chk':''}"><input type="radio" name="attend" value="unsure" ${attend==='unsure'?'checked':''}><span>❓ Not sure yet</span></label>
        <label class="rsvp-no ${attend==='not_coming'?'chk no':''}"><input type="radio" name="attend" value="not_coming" ${attend==='not_coming'?'checked':''}><span>❌ Can't make it</span></label>
      </div>
    </section>

    <section class="card">
      <h2>Your contact info</h2>
      <p class="sub">So Kari can reach you. Both optional, at least one helps.</p>
      <div class="row">
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" value="${esc(member.phone || '')}" placeholder="(320) 555-0123" autocomplete="tel"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="${esc(member.email || '')}" placeholder="you@somewhere.com" autocomplete="email"></div>
      </div>
      <div class="field"><label for="notes">Notes for Kari (optional)</label><textarea id="notes" name="notes" placeholder="Anything Kari should know — allergies, kids you'll bring, times you can't stay">${esc(member.notes || '')}</textarea></div>
    </section>

    ${member.packet_url ? `<div class="packet-card"><div class="pl"><h3>📖 Your Rooted Conversation Guide</h3><p>Your podcast packet — read before we record. Link expires in 24 hours, so save it to your device.</p></div><a href="${esc(member.packet_url)}" target="_blank" rel="noopener" download>Download PDF</a></div>` : ''}

    ${event.agenda && event.agenda.length ? `
    <section class="card">
      <h2>The day's agenda</h2>
      <p class="sub">Here's the flow for October 10th — <strong style="color:var(--red-deep)">pending final approval from the hosts.</strong></p>
      <div class="agenda">
        ${event.agenda.map(item => `<div class="agenda-row"><div class="t">${esc(item.time)}</div><div class="a">${esc(item.activity)}</div></div>`).join('')}
      </div>
    </section>` : ''}

    <div class="callout"><strong>Expected of everyone</strong>The whole day is hands-on. Whether or not you sign up for a specific team, please jump in with crafts + mingling with our ladies — that's the whole vibe.</div>

    <section class="card ${notComing?'':''}">
      <h2>Where would you love to help?</h2>
      <p class="sub">Check as many as you'd like. Your picks save automatically. Each role has its time slot listed — sign up for what fits your day.</p>
      ${notComing ? '<p class="sub" style="color:var(--red-deep)">You said you can\'t make it — role sign-ups are turned off. Change your RSVP above to sign up.</p>' : ''}
      <div class="roles" id="roles"></div>
    </section>
  `;

  // Render roles
  const rolesEl = document.getElementById('roles');
  for (const role of roles){
    const tally = tallies[role.role_key] || {count:0, names:[]};
    const others = tally.names.filter(n => n !== member.name);
    const filled = tally.count >= role.min_needed;
    const div = document.createElement('div');
    div.className = 'role' + (mySet.has(role.role_key) ? ' picked' : '') + (notComing ? ' dim' : '');
    div.innerHTML = `
      <div class="icon">${esc(role.icon || '·')}</div>
      <div class="body">
        <div class="name"><span>${esc(role.name)}</span><span class="need ${filled ? 'filled' : ''}">${tally.count}/${role.min_needed}${role.max_needed > role.min_needed ? '–'+role.max_needed : ''}</span></div>
        ${role.time_slot ? `<div><span class="time">🕐 ${esc(role.time_slot)}</span></div>` : ''}
        <div class="desc">${esc(role.description || '')}</div>
        ${others.length ? `<div class="others">Also on this team: ${esc(others.join(', '))}</div>` : ''}
      </div>
      <label class="toggle"><input type="checkbox" data-role="${esc(role.role_key)}" ${mySet.has(role.role_key) ? 'checked' : ''} ${notComing?'disabled':''}></label>
    `;
    rolesEl.appendChild(div);
  }

  // Wire RSVP
  document.querySelectorAll('input[type=radio][name=attend]').forEach(r => {
    r.addEventListener('change', async (e) => {
      try {
        const res = await fetch(`${API_BASE}?t=${encodeURIComponent(token)}`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({attendance_status: r.value})
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderPage(data);
        showSaved(r.value === 'not_coming' ? 'RSVP saved — see you next time' : 'RSVP saved');
      } catch { showSaved('Save failed', true); }
    });
  });

  // Wire role toggles — optimistic UI, no full re-render, so rapid clicks don't flicker
  rolesEl.querySelectorAll('input[type=checkbox][data-role]').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      const key = cb.dataset.role;
      const wasChecked = cb.checked;
      const roleEl = cb.closest('.role');
      // Optimistic visual toggle
      roleEl.classList.toggle('picked', wasChecked);
      const body = wasChecked ? {add_role: key} : {remove_role: key};
      try {
        const r = await fetch(`${API_BASE}?t=${encodeURIComponent(token)}`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error('save failed');
        const data = await r.json();
        // Update the tally + others line for JUST this role, in place
        const tally = data.tallies[key] || {count:0, names:[]};
        const role = data.roles.find(r => r.role_key === key);
        const needEl = roleEl.querySelector('.need');
        if (needEl && role){
          needEl.textContent = `${tally.count}/${role.min_needed}${role.max_needed > role.min_needed ? '–'+role.max_needed : ''}`;
          needEl.classList.toggle('filled', tally.count >= role.min_needed);
        }
        const others = tally.names.filter(n => n !== data.member.name);
        let othersEl = roleEl.querySelector('.others');
        if (others.length){
          if (!othersEl){
            othersEl = document.createElement('div');
            othersEl.className = 'others';
            roleEl.querySelector('.body').appendChild(othersEl);
          }
          othersEl.textContent = 'Also on this team: ' + others.join(', ');
        } else if (othersEl){
          othersEl.remove();
        }
        showSaved();
      } catch (err){
        cb.checked = !wasChecked;
        roleEl.classList.toggle('picked', !wasChecked);
        showSaved('Save failed — try again', true);
      }
    });
  });

  // Wire contact-info debounced autosave
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  ['phone','email','notes'].forEach(name => {
    const el = document.getElementById(name);
    if (!el) return;
    const save = debounce(async () => {
      try {
        const body = {}; body[name] = el.value;
        const r = await fetch(`${API_BASE}?t=${encodeURIComponent(token)}`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error();
        showSaved();
      } catch { showSaved('Save failed', true); }
    }, 700);
    el.addEventListener('input', save);
  });
}

loadPage();
</script>

</body>
</html>
