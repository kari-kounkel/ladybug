<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Sign-Up · Ladybug, Ladybug</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,600&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--card-edge:rgba(177,18,38,.13);
  --red:#B11226;--red-deep:#861019;--red-soft:#C8324A;
  --gold:#C29A3B;--gold-deep:#9E7A24;
  --ink:#1A1614;--ink-soft:#6B5E52;--ink-dim:#9A8C7C;
  --cream:#FBF3E2;--green:#5B7F4E;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Mulish',sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% -8%,#FFFFFF 0%,#FFFAFA 40%,#FBEDEF 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;background-image:radial-gradient(circle at 8% 12%,rgba(177,18,38,.10) 0 9px,transparent 10px),radial-gradient(circle at 92% 10%,rgba(14,12,10,.05) 0 7px,transparent 8px),radial-gradient(circle at 20% 80%,rgba(177,18,38,.08) 0 6px,transparent 7px),radial-gradient(circle at 84% 82%,rgba(177,18,38,.08) 0 8px,transparent 9px);background-repeat:no-repeat}
.nav{padding:20px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(177,18,38,.08)}
.nav a.back{text-decoration:none;color:var(--ink-soft);font-family:'Mulish',sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem;transition:color .2s}
.nav a.back:hover{color:var(--red)}
.nav .brand{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--red);font-size:.9rem}
.wrap{max-width:900px;width:100%;margin:0 auto;padding:36px 24px 80px;flex:1}
.kicker{font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:.68rem;color:var(--red);text-align:center;margin-bottom:14px}
h1{font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:clamp(2rem,5.6vw,3rem);line-height:1.05;letter-spacing:-.015em;text-align:center;margin-bottom:10px}
.event-meta{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:clamp(1rem,2.4vw,1.15rem);text-align:center;margin-bottom:8px}
.greeting{font-family:'Fraunces',serif;font-style:italic;color:var(--red);font-size:clamp(1.05rem,2.4vw,1.2rem);text-align:center;margin:18px 0 24px}
.save-pill{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;padding:8px 16px;border-radius:999px;font-family:'Mulish',sans-serif;font-weight:800;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;background:var(--green);color:#fff;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 10px 22px rgba(0,0,0,.15)}
.save-pill.show{opacity:.92}
.save-pill.err{background:var(--red)}
section.card{background:#fff;border:1.5px solid var(--card-edge);border-radius:18px;padding:24px 24px 22px;box-shadow:0 12px 26px rgba(177,18,38,.06);margin-bottom:18px}
@media(max-width:560px){section.card{padding:20px 18px}}
.card h2{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(1.15rem,2.8vw,1.35rem);color:var(--ink);margin-bottom:6px}
.card .sub{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:.94rem;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-family:'Mulish',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.field input,.field textarea{width:100%;font-family:'Mulish',sans-serif;font-size:.98rem;color:var(--ink);background:#FDFCFA;border:1.5px solid rgba(28,22,20,.16);border-radius:10px;padding:11px 13px;transition:border .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(177,18,38,.08);background:#fff}
.field textarea{resize:vertical;min-height:80px;font-family:'Fraunces',serif;font-size:1rem;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.roles{display:flex;flex-direction:column;gap:10px}
.role{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1.5px solid var(--card-edge);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s}
.role:hover{border-color:var(--red-soft)}
.role.picked{background:linear-gradient(180deg,#fff,#FCF1F2);border-color:var(--red)}
.role .icon{font-size:1.6rem;line-height:1;flex:0 0 30px;text-align:center;margin-top:2px}
.role .body{flex:1;min-width:0}
.role .name{font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:1.05rem;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.role .need{font-family:'Mulish',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);white-space:nowrap}
.role .need.filled{color:var(--green)}
.role .desc{font-size:.9rem;color:var(--ink-soft);margin-top:3px;line-height:1.45}
.role .others{font-family:'Fraunces',serif;font-style:italic;font-size:.82rem;color:var(--ink-dim);margin-top:6px}
.role .toggle{flex:0 0 auto;align-self:center}
.role .toggle input{width:22px;height:22px;accent-color:var(--red);cursor:pointer}
footer{text-align:center;padding:24px;color:var(--ink-dim);font-size:.76rem;font-family:'Fraunces',serif;font-style:italic}
.error-box{padding:20px 24px;background:rgba(177,18,38,.06);border:1.5px solid rgba(177,18,38,.25);border-radius:14px;color:var(--red-deep);max-width:480px;margin:80px auto;text-align:center}
.error-box h2{font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;margin-bottom:10px}
.spinner{width:36px;height:36px;border:3px solid rgba(177,18,38,.18);border-top-color:var(--red);border-radius:50%;margin:80px auto;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="nav">
  <a class="back" href="/">← Back to the book</a>
  <span class="brand">Ladybug, Ladybug</span>
</nav>

<div class="save-pill" id="save-pill" aria-live="polite">✓ Saved</div>

<main class="wrap" id="wrap">
  <div class="spinner" id="spinner"></div>
</main>

<footer>Many hands. One heart. A legacy of encouragement.</footer>

<script>
const API_BASE = '/api/team';
const params = new URLSearchParams(location.search);
const token = params.get('t');
const wrap = document.getElementById('wrap');
const pill = document.getElementById('save-pill');

function showSaved(msg, isErr){
  pill.textContent = isErr ? '⚠ ' + msg : '✓ ' + (msg || 'Saved');
  pill.classList.toggle('err', !!isErr);
  pill.classList.add('show');
  clearTimeout(showSaved._t);
  showSaved._t = setTimeout(() => pill.classList.remove('show'), 1600);
}

function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function loadPage(){
  if (!token || !/^[A-Za-z0-9_-]{8,64}$/.test(token)){
    wrap.innerHTML = '<div class="error-box"><h2>This link is missing something.</h2><p>Ask Kari for your team sign-up link — it should look like <code>ladybug.karikounkel.com/team?t=...</code></p></div>';
    return;
  }
  const r = await fetch(`${API_BASE}?t=${encodeURIComponent(token)}`, {cache:'no-store'});
  if (r.status === 404){
    wrap.innerHTML = '<div class="error-box"><h2>We don\'t recognize this link.</h2><p>Ask Kari for a fresh one — the token in your URL isn\'t matching any team member.</p></div>';
    return;
  }
  if (!r.ok){
    wrap.innerHTML = '<div class="error-box"><h2>Something went sideways.</h2><p>Refresh the page. If it keeps happening, email <a href="mailto:kari@karikounkel.com">kari@karikounkel.com</a>.</p></div>';
    return;
  }
  const data = await r.json();
  renderPage(data);
}

function renderPage(data){
  const { event, roles, member, my_signups, tallies } = data;
  const mySet = new Set(my_signups);

  wrap.innerHTML = `
    <p class="kicker">Team Sign-Up</p>
    <h1>${esc(event.name)}</h1>
    <p class="event-meta">${esc(event.event_date || '')}${event.time_range ? ' · ' + esc(event.time_range) : ''}${event.location ? ' · ' + esc(event.location) : ''}</p>
    <p class="greeting">Hi ${esc(member.name || 'friend')} — pick where you'd love to serve.</p>

    <section class="card">
      <h2>Your contact info</h2>
      <p class="sub">So Kari can reach you. Both optional, but at least one is helpful.</p>
      <div class="row">
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" value="${esc(member.phone || '')}" placeholder="(320) 555-0123" autocomplete="tel"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="${esc(member.email || '')}" placeholder="you@somewhere.com" autocomplete="email"></div>
      </div>
      <div class="field"><label for="notes">Notes for Kari (optional)</label><textarea id="notes" name="notes" placeholder="Anything Kari should know — allergies, kids you'll bring, times you can't stay">${esc(member.notes || '')}</textarea></div>
    </section>

    <section class="card">
      <h2>Where would you love to help?</h2>
      <p class="sub">Check as many as you'd like. Your picks save automatically the moment you tap.</p>
      <div class="roles" id="roles"></div>
    </section>
  `;

  // Render roles
  const rolesEl = document.getElementById('roles');
  for (const role of roles){
    const tally = tallies[role.role_key] || {count:0, names:[]};
    const others = tally.names.filter(n => n !== member.name);
    const filled = tally.count >= role.min_needed;
    const div = document.createElement('div');
    div.className = 'role' + (mySet.has(role.role_key) ? ' picked' : '');
    div.innerHTML = `
      <div class="icon">${esc(role.icon || '·')}</div>
      <div class="body">
        <div class="name"><span>${esc(role.name)}</span><span class="need ${filled ? 'filled' : ''}">${tally.count}/${role.min_needed}${role.max_needed > role.min_needed ? '–'+role.max_needed : ''}</span></div>
        <div class="desc">${esc(role.description || '')}</div>
        ${others.length ? `<div class="others">Also on this team: ${esc(others.join(', '))}</div>` : ''}
      </div>
      <label class="toggle"><input type="checkbox" data-role="${esc(role.role_key)}" ${mySet.has(role.role_key) ? 'checked' : ''}></label>
    `;
    rolesEl.appendChild(div);
  }

  // Wire role toggles
  rolesEl.querySelectorAll('input[type=checkbox][data-role]').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      const key = cb.dataset.role;
      const body = cb.checked ? {add_role: key} : {remove_role: key};
      try {
        const r = await fetch(`${API_BASE}?t=${encodeURIComponent(token)}`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error('save failed');
        const data = await r.json();
        renderPage(data);       // re-render with updated tallies
        showSaved();
      } catch (err){
        cb.checked = !cb.checked;
        showSaved('Save failed — try again', true);
      }
    });
  });

  // Wire contact-info debounced autosave
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  ['phone','email','notes'].forEach(name => {
    const el = document.getElementById(name);
    if (!el) return;
    const save = debounce(async () => {
      try {
        const body = {}; body[name] = el.value;
        const r = await fetch(`${API_BASE}?t=${encodeURIComponent(token)}`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error('save failed');
        showSaved();
      } catch (err){
        showSaved('Save failed', true);
      }
    }, 700);
    el.addEventListener('input', save);
  });
}

loadPage();
</script>

</body>
</html>
