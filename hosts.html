<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendee List · Ladybug Day</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,600&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#B11226;--red-deep:#861019;--red-soft:#C8324A;
  --gold:#C29A3B;--gold-deep:#9E7A24;
  --ink:#1A1614;--ink-soft:#6B5E52;--ink-dim:#9A8C7C;
  --card-edge:rgba(177,18,38,.13);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Mulish',sans-serif;color:var(--ink);background:#fff;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% -8%,#FFFFFF 0%,#FFFAFA 50%,#FBEDEF 100%)}
.nav{padding:18px 24px;text-align:center;border-bottom:1px solid rgba(177,18,38,.08)}
.nav .brand{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--red);font-size:.95rem}
.wrap{max-width:1000px;width:100%;margin:0 auto;padding:32px 22px 60px}
.hdr{text-align:center;margin-bottom:24px}
.kicker{font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:.68rem;color:var(--red);margin-bottom:10px}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(1.9rem,5vw,2.6rem);color:var(--ink);line-height:1.05;margin-bottom:8px}
.meta{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:1.05rem}
.counts{display:flex;justify-content:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.count{background:#fff;border:1.5px solid var(--card-edge);border-radius:14px;padding:14px 22px;text-align:center;min-width:140px}
.count .n{font-family:'Fraunces',serif;font-weight:900;color:var(--red);font-size:2rem;line-height:1}
.count .l{font-family:'Mulish',sans-serif;font-weight:700;font-size:.66rem;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase;margin-top:4px}
.card{background:#fff;border:1.5px solid var(--card-edge);border-radius:16px;box-shadow:0 10px 22px rgba(177,18,38,.05);margin-top:24px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.64rem;color:var(--ink-soft);padding:12px 12px;background:#FBF5EB;border-bottom:1px solid rgba(177,18,38,.08)}
td{padding:12px;border-bottom:1px solid rgba(28,22,20,.06);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FDF6F6}
.print{text-align:center;margin-top:20px}
.print button{font-family:'Mulish',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;background:#fff;color:var(--ink-soft);border:1.5px solid var(--card-edge);padding:10px 18px;border-radius:999px;cursor:pointer}
.print button:hover{border-color:var(--red);color:var(--red)}
.empty{text-align:center;padding:60px 20px;color:var(--ink-dim);font-family:'Fraunces',serif;font-style:italic;font-size:1rem}
.spinner{width:36px;height:36px;border:3px solid rgba(177,18,38,.18);border-top-color:var(--red);border-radius:50%;margin:80px auto;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{padding:24px;background:rgba(177,18,38,.06);border:1.5px solid rgba(177,18,38,.25);border-radius:14px;color:var(--red-deep);max-width:520px;margin:80px auto;text-align:center;font-family:'Fraunces',serif}
footer{text-align:center;padding:20px;color:var(--ink-dim);font-size:.76rem;font-family:'Fraunces',serif;font-style:italic}
@media print{
  body{background:#fff}
  .nav,.print,footer{display:none}
  .card{border:none;box-shadow:none}
  tr:hover td{background:transparent}
  th{background:#F8F0EC}
}
</style>
</head>
<body>

<nav class="nav"><span class="brand">Ladybug, Ladybug · Attendee List</span></nav>

<main class="wrap" id="app"><div class="spinner"></div></main>

<footer>Read-only list · shared by Kari Kounkel · Fast Camel Press</footer>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('t');

function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function prettyDate(iso){ if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }); }

async function load(){
  const app = document.getElementById('app');
  if (!token) {
    app.innerHTML = '<div class="error-box"><h2 style="font-family:\'Fraunces\',serif;font-weight:700;font-size:1.4rem;margin-bottom:10px">Missing link key</h2><p>Ask Kari for the full attendee-list link — it includes a token after <code>?t=</code>.</p></div>';
    return;
  }
  try {
    const r = await fetch(`/api/hosts?t=${encodeURIComponent(token)}`, {cache:'no-store'});
    if (r.status === 404) throw new Error('not_found');
    if (!r.ok) throw new Error('server_error');
    const data = await r.json();
    render(data);
  } catch (e) {
    app.innerHTML = `<div class="error-box"><h2 style="font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;margin-bottom:10px">We don't recognize that link.</h2><p>Ask Kari for a fresh one.</p></div>`;
  }
}

function render(data){
  const {event, attendees, total_people} = data;
  const rows = attendees.length === 0
    ? '<tr><td colspan="6" class="empty">No one has registered yet. Check back soon.</td></tr>'
    : attendees.map(a => `<tr>
        <td><strong style="font-family:'Fraunces',serif">${esc(a.name)}</strong>${a.attending_with ? `<div style="font-size:.78rem;color:var(--ink-soft);font-style:italic;margin-top:2px">with ${esc(a.attending_with)}</div>` : ''}</td>
        <td>${esc(a.email || '')}${a.phone ? '<br><span style="color:var(--ink-soft)">' + esc(a.phone) + '</span>' : ''}</td>
        <td style="text-align:center">${a.party_size || 1}</td>
        <td>${esc(a.home_church || '')}${a.city_state ? '<br><span style="color:var(--ink-soft);font-size:.82rem">' + esc(a.city_state) + '</span>' : ''}</td>
        <td>${a.dietary ? '<div><strong style="color:var(--red-deep)">Diet:</strong> ' + esc(a.dietary) + '</div>' : ''}${a.notes ? '<div style="color:var(--ink-soft);font-style:italic;margin-top:4px">' + esc(a.notes) + '</div>' : ''}${!a.dietary && !a.notes ? '<span style="color:var(--ink-dim)">—</span>' : ''}</td>
        <td style="color:var(--ink-soft);font-size:.78rem;white-space:nowrap">${new Date(a.created_at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</td>
      </tr>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="hdr">
      <p class="kicker">Attendee List</p>
      <h1>${esc(event.name)}</h1>
      <p class="meta">${esc(prettyDate(event.event_date))}${event.time_range ? ' · ' + esc(event.time_range) : ''}</p>
      ${event.location ? `<p class="meta">${esc(event.location)}</p>` : ''}
      <div class="counts">
        <div class="count"><div class="n">${attendees.length}</div><div class="l">Registrations</div></div>
        <div class="count"><div class="n">${total_people}</div><div class="l">Total people</div></div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Contact</th><th style="text-align:center">Party</th><th>Church / City</th><th>Dietary / Notes</th><th>Registered</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="print"><button onclick="window.print()">🖨 Print / save as PDF</button></div>`;
}

load();
</script>
</body>
</html>
