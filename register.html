<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T1PLCXES2Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-T1PLCXES2Y');
</script>
<title>Register · Ladybug, Ladybug</title>
<meta name="description" content="Register for Ladybug Day — a women's gathering. Books, crafts, speakers, food, friendship.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,600&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--card-edge:rgba(177,18,38,.13);
  --red:#B11226;--red-deep:#861019;--red-soft:#C8324A;
  --gold:#C29A3B;--gold-deep:#9E7A24;
  --ink:#1A1614;--ink-soft:#6B5E52;--ink-dim:#9A8C7C;
  --cream:#FBF3E2;--green:#5B7F4E;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Mulish',sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% -8%,#FFFFFF 0%,#FFFAFA 40%,#FBEDEF 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;background-image:radial-gradient(circle at 8% 12%,rgba(177,18,38,.10) 0 9px,transparent 10px),radial-gradient(circle at 92% 10%,rgba(14,12,10,.05) 0 7px,transparent 8px),radial-gradient(circle at 20% 80%,rgba(177,18,38,.08) 0 6px,transparent 7px),radial-gradient(circle at 84% 82%,rgba(177,18,38,.08) 0 8px,transparent 9px);background-repeat:no-repeat}
.nav{padding:20px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(177,18,38,.08)}
.nav a.back{text-decoration:none;color:var(--ink-soft);font-family:'Mulish',sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem}
.nav a.back:hover{color:var(--red)}
.nav .brand{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--red);font-size:.9rem}
.wrap{max-width:720px;width:100%;margin:0 auto;padding:36px 24px 80px;flex:1}
.kicker{font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:.68rem;color:var(--red);text-align:center;margin-bottom:12px}
h1{font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:clamp(2rem,5.6vw,2.9rem);line-height:1.05;letter-spacing:-.015em;text-align:center;margin-bottom:10px}
.event-meta{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:clamp(1rem,2.4vw,1.15rem);text-align:center;margin-bottom:6px}
.event-loc{font-family:'Mulish',sans-serif;font-size:.82rem;color:var(--ink-dim);text-align:center;letter-spacing:.03em;margin-bottom:14px}
.count-pill{display:block;font-family:'Fraunces',serif;font-style:italic;font-size:.98rem;color:var(--red-deep);text-align:center;margin:20px auto 28px}
section.card{background:#fff;border:1.5px solid var(--card-edge);border-radius:18px;padding:24px 28px;box-shadow:0 12px 26px rgba(177,18,38,.06);margin-bottom:16px}
@media(max-width:560px){section.card{padding:20px 20px}}
.field{margin-bottom:14px}
.field label{display:block;font-family:'Mulish',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.field .hint{display:block;font-family:'Fraunces',serif;font-style:italic;color:var(--ink-dim);font-size:.8rem;margin-bottom:6px;letter-spacing:0;text-transform:none}
.field input,.field textarea{width:100%;font-family:'Mulish',sans-serif;font-size:.98rem;color:var(--ink);background:#FDFCFA;border:1.5px solid rgba(28,22,20,.16);border-radius:10px;padding:11px 13px;transition:border .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(177,18,38,.08);background:#fff}
.field textarea{resize:vertical;min-height:70px;font-family:'Fraunces',serif;font-size:1rem;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.actions{display:flex;justify-content:center;margin-top:8px}
.btn{font-family:'Mulish',sans-serif;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.82rem;background:var(--red);color:#FFF8E8;padding:16px 42px;border-radius:999px;border:2px solid var(--red);cursor:pointer;box-shadow:0 12px 26px rgba(134,16,25,.28);transition:all .25s}
.btn:hover{background:var(--red-deep);transform:translateY(-2px);box-shadow:0 16px 32px rgba(134,16,25,.36)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.form-note{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:.85rem;text-align:center;margin-top:14px}
.error{margin-top:14px;padding:12px 16px;background:rgba(177,18,38,.06);border:1px solid rgba(177,18,38,.25);border-radius:10px;color:var(--red-deep);font-size:.92rem;display:none}
.error.show{display:block}
.thanks{display:none;text-align:center;padding:40px 24px}
.thanks.show{display:block}
.thanks .bug{font-size:3.4rem;margin-bottom:14px}
.thanks h2{font-family:'Fraunces',serif;font-weight:700;color:var(--red);font-size:clamp(1.8rem,5vw,2.4rem);margin-bottom:14px}
.thanks p{font-size:1.05rem;color:var(--ink-soft);max-width:44ch;margin:0 auto 8px;line-height:1.55}
.thanks .home-link{display:inline-block;margin-top:26px;font-family:'Mulish',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--red);text-decoration:none;border-bottom:1.5px solid var(--red);padding-bottom:2px}
footer{text-align:center;padding:24px;color:var(--ink-dim);font-size:.76rem;font-family:'Fraunces',serif;font-style:italic}
.spinner{width:32px;height:32px;border:3px solid rgba(177,18,38,.18);border-top-color:var(--red);border-radius:50%;margin:60px auto;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="nav">
  <a class="back" href="/">← Back to the book</a>
  <span class="brand">Ladybug, Ladybug</span>
</nav>

<main class="wrap" id="wrap">
  <div class="spinner"></div>
</main>

<footer>Many hands. One heart. A legacy of encouragement.</footer>

<script>
const wrap = document.getElementById('wrap');

function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function boot(){
  try {
    const r = await fetch('/api/register', {cache:'no-store'});
    if (!r.ok) throw new Error('no active event');
    const data = await r.json();
    render(data);
  } catch(e){
    wrap.innerHTML = '<section class="card"><h2 style="font-family:\'Fraunces\',serif">No open events right now.</h2><p style="color:var(--ink-soft)">Check back soon.</p></section>';
  }
}

function prettyDate(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function render(data){
  const {event, registrations, total_people} = data;
  const already = total_people
    ? (total_people === 1 ? "You'll be the first to register. 🐞" : `You'll be joining ${total_people} others already registered.`)
    : "";

  wrap.innerHTML = `
    <p class="kicker">Register</p>
    <h1>${esc(event.name)}</h1>
    <p class="event-meta">${esc(prettyDate(event.event_date))}${event.time_range ? ' · ' + esc(event.time_range) : ''}</p>
    ${event.location ? `<p class="event-loc">${esc(event.location)}</p>` : ''}
    ${already ? `<p class="count-pill">${esc(already)}</p>` : ''}

    <section class="card" style="background:linear-gradient(180deg,#fff,#FCF1F2);border-color:var(--red-soft)">
      <h2 style="font-family:'Fraunces',serif;font-weight:700;color:var(--red-deep);text-align:center;margin-bottom:12px">What to expect</h2>
      <ul style="list-style:none;padding:0;margin:0;display:grid;gap:10px;font-family:'Fraunces',serif;font-size:.98rem;color:var(--ink)">
        <li style="padding-left:32px;position:relative"><span style="position:absolute;left:0;top:1px">📖</span>Copies of the book available for purchase</li>
        <li style="padding-left:32px;position:relative"><span style="position:absolute;left:0;top:1px">🎨</span>Your very own Bug Off Box and activities</li>
        <li style="padding-left:32px;position:relative"><span style="position:absolute;left:0;top:1px">🎤</span>Speakers, worship, and a keynote from Kari</li>
        <li style="padding-left:32px;position:relative"><span style="position:absolute;left:0;top:1px">🍴</span>Lunch and fellowship together</li>
        <li style="padding-left:32px;position:relative"><span style="position:absolute;left:0;top:1px">💚</span>A whole lot of new friends</li>
      </ul>
    </section>

    <form id="reg-form" autocomplete="on">
      <section class="card">
        <div class="row">
          <div class="field"><label for="name">Your name *</label><input id="name" name="name" type="text" required maxlength="200" autocomplete="name"></div>
          <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required maxlength="200" autocomplete="email"></div>
        </div>
        <div class="row">
          <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" maxlength="40" autocomplete="tel"></div>
          <div class="field"><label for="party_size">How many in your party</label><input id="party_size" name="party_size" type="number" min="1" max="20" value="1"></div>
        </div>
        <div class="field">
          <label for="attending_with">Who you're coming with</label>
          <span class="hint">Optional. Names of anyone you're bringing, so we can seat you together.</span>
          <input id="attending_with" name="attending_with" type="text" maxlength="200" placeholder="my daughter Sarah · Rebecca &amp; Ann · alone">
        </div>
      </section>

      <section class="card">
        <div class="row">
          <div class="field"><label for="home_church">Home church</label><input id="home_church" name="home_church" type="text" maxlength="200"></div>
          <div class="field"><label for="city_state">City / state</label><input id="city_state" name="city_state" type="text" maxlength="120" placeholder="St. Cloud, MN"></div>
        </div>
        <div class="field">
          <label for="dietary">Allergies / dietary needs</label>
          <span class="hint">The hospitality team is planning food. If you have any allergies or restrictions, tell them here.</span>
          <input id="dietary" name="dietary" type="text" maxlength="300" placeholder="gluten free · nut allergy · vegetarian">
        </div>
        <div class="field">
          <label for="notes">Anything the team should know</label>
          <textarea id="notes" name="notes" placeholder="First-time visitor · bringing my mom · questions"></textarea>
        </div>
      </section>

      <div class="actions"><button class="btn" type="submit" id="submit">Save my spot 🐞</button></div>
      <div class="error" id="error" role="alert"></div>
      <p class="form-note">Kari will send a confirmation email. See you October 10.</p>
    </form>
  `;

  const form = document.getElementById('reg-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('error');
    err.classList.remove('show'); err.textContent = '';

    const payload = {};
    for (const el of form.querySelectorAll('input,textarea')) {
      payload[el.name] = el.value;
    }
    if (!payload.name.trim()) { showError("Name's required."); return; }
    if (!payload.email.trim() || !payload.email.includes('@')) { showError("Email looks off — Kari will confirm by email so it needs to work."); return; }

    const btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = 'Saving…';

    try {
      const r = await fetch('/api/register', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.detail || j.error || 'save failed');
      showThanks(payload.name);
      if (typeof gtag === 'function') gtag('event', 'ladybug_registration', {event_slug: event.slug});
    } catch(e){
      btn.disabled = false; btn.textContent = 'Save my spot 🐞';
      showError('Something went sideways: ' + (e.message || 'try again') + '. If it keeps failing, email kari@karikounkel.com.');
    }
  });
}

function showError(m){ const e = document.getElementById('error'); e.textContent = m; e.classList.add('show'); }

function showThanks(name){
  const first = name.split(' ')[0];
  wrap.innerHTML = `
    <div class="thanks show">
      <div class="bug">🐞🐞🐞</div>
      <h2>You're on the list, ${esc(first)}!</h2>
      <p>Your spot is saved. A confirmation email is landing in your inbox now — check spam if it hides.</p>
      <p style="font-family:'Fraunces',serif;font-style:italic;color:var(--red-deep);font-size:1.1rem;margin-top:14px">Save the date: <strong>Saturday, October 10, 2026.</strong></p>
      <p style="margin-top:10px">Bring your ladies. Wear something you love.</p>
      <div style="margin-top:32px"><a class="btn" href="/" style="text-decoration:none">← Take me back to the book</a></div>
    </div>`;
  window.scrollTo({top:0, behavior:'smooth'});
}

boot();
</script>

<!-- Ask Kari widget -->
<script src="https://chat.karikounkel.com/widget.js" defer></script>
</body>
</html>
